<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bikeGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" />

  <!-- Technical Circuit / Gear Ring Accent -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="16 12" opacity="0.35" />
  <circle cx="256" cy="256" r="196" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 8" opacity="0.2" />

  <!-- Main Bike Emblem -->
  <g transform="translate(68, 72) scale(3.9)" filter="url(#glow512)">
    <!-- Wheels -->
    <circle cx="20" cy="62" r="15" fill="none" stroke="url(#bikeGrad512)" stroke-width="4"/>
    <circle cx="20" cy="62" r="4" fill="#38bdf8"/>
    <circle cx="76" cy="62" r="15" fill="none" stroke="url(#bikeGrad512)" stroke-width="4"/>
    <circle cx="76" cy="62" r="4" fill="#38bdf8"/>

    <!-- Frame Geometry -->
    <path d="M20 62 L42 62 L58 36 L34 36 Z" fill="none" stroke="url(#bikeGrad512)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 62 L48 24" fill="none" stroke="url(#bikeGrad512)" stroke-width="4" stroke-linecap="round"/>
    <path d="M76 62 L60 22" fill="none" stroke="url(#bikeGrad512)" stroke-width="4" stroke-linecap="round"/>

    <!-- Handlebars & Seat -->
    <path d="M54 22 L66 22 L70 28" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 24 L54 24" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Bottom Bracket / Chainring -->
    <circle cx="42" cy="62" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
  </g>

  <!-- Typography Brand -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">A2RUEDAS</text>
  <text x="256" y="468" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" letter-spacing="6">TALLER DE BICICLETAS</text>
</svg>
