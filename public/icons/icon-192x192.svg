<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bikeGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="glow192" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="192" height="192" rx="40" fill="url(#bgGrad192)" />

  <!-- Outer Ring Accent -->
  <circle cx="96" cy="96" r="82" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Bicycle Emblem -->
  <g transform="translate(24, 28) scale(1.5)" filter="url(#glow192)">
    <!-- Wheels -->
    <circle cx="20" cy="62" r="15" fill="none" stroke="url(#bikeGrad192)" stroke-width="4.5"/>
    <circle cx="20" cy="62" r="4" fill="#38bdf8"/>
    <circle cx="76" cy="62" r="15" fill="none" stroke="url(#bikeGrad192)" stroke-width="4.5"/>
    <circle cx="76" cy="62" r="4" fill="#38bdf8"/>

    <!-- Frame Geometry -->
    <path d="M20 62 L42 62 L58 36 L34 36 Z" fill="none" stroke="url(#bikeGrad192)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 62 L48 24" fill="none" stroke="url(#bikeGrad192)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M76 62 L60 22" fill="none" stroke="url(#bikeGrad192)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Handlebars & Seat -->
    <path d="M54 22 L66 22 L70 28" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M42 24 L54 24" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>

    <!-- Chainring -->
    <circle cx="42" cy="62" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Small Wordmark Tag -->
  <text x="96" y="162" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2">A2RUEDAS</text>
</svg>
