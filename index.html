<html lang="es" class="h-full">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta name="description" content="A2Ruedas - Sistema profesional de gestión de taller de bicicletas" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- PWA iOS & Mobile Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="netlify-disable-drawer" content="true" />
    <style>
      /* Ocultar badge y drawer flotante de Netlify en móviles y escritorio */
      #netlify-badge,
      .netlify-badge,
      netlify-drawer,
      [data-netlify-drawer],
      [class*="netlify-feedback"],
      [class*="netlify-drawer"],
      div[data-netlify-identity-menu],
      iframe[src*="netlify"],
      div[class*="feedback-button"],
      div[aria-label*="Netlify"] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
        opacity: 0 !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>
    <title>A2Ruedas — Taller de Bicicletas</title>
